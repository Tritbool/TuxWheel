name: Android Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve latest stable BLE release
        id: ble-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh api repos/Tritbool/euc_ble_library/releases/latest --jq .tag_name)"
          git check-ref-format "refs/tags/$tag"
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::Unsupported BLE release tag: $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building with BLE release $tag"

      - name: Select Maven or GitHub BLE source
        id: ble-source
        env:
          BLE_VERSION: ${{ steps.ble-release.outputs.version }}
        run: |
          set -euo pipefail
          source=maven
          for artifact in euc-ble-library euc-ble-core euc-ble-core-jvm \
              euc-ble-session euc-ble-session-jvm euc-ble-protocols euc-ble-protocols-jvm; do
            files=("$artifact-$BLE_VERSION.pom" "$artifact-$BLE_VERSION.module")
            case "$artifact" in
              euc-ble-library) files+=("$artifact-$BLE_VERSION.aar") ;;
              *-jvm) files+=("$artifact-$BLE_VERSION.jar") ;;
            esac
            for file in "${files[@]}"; do
              url="https://repo.maven.apache.org/maven2/io/github/tritbool/$artifact/$BLE_VERSION/$file"
              status="$(curl --head --silent --show-error --connect-timeout 10 --max-time 30 \
                --output /dev/null --write-out '%{http_code}' "$url")"
              case "$status" in
                200) ;;
                404)
                  echo "Not yet published: $url"
                  source=github
                  ;;
                *)
                  echo "::error::Maven availability check failed (HTTP $status): $url"
                  exit 1
                  ;;
              esac
            done
          done
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "Building BLE $BLE_VERSION from $source"

      - name: Checkout BLE library release
        if: steps.ble-source.outputs.source == 'github'
        uses: actions/checkout@v4
        with:
          repository: Tritbool/euc_ble_library
          ref: refs/tags/${{ steps.ble-release.outputs.tag }}
          path: .ci/euc-ble-library
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble release APK
        env:
          BLE_VERSION: ${{ steps.ble-release.outputs.version }}
          BLE_SOURCE: ${{ steps.ble-source.outputs.source }}
        run: |
          set -euo pipefail
          args=("-PeucBleVersion=$BLE_VERSION")
          if [[ "$BLE_SOURCE" == github ]]; then
            args+=("-PeucBleLibraryDir=.ci/euc-ble-library" "-Peuc.androidGradlePluginVersion=9.2.1")
          fi
          ./gradlew "${args[@]}" :app:assembleRelease --no-daemon

      - name: Sign and verify APK
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          : "${KEYSTORE_BASE64:?Secret KEYSTORE_BASE64 absent}"
          : "${KEY_ALIAS:?Secret KEY_ALIAS absent}"
          : "${KEYSTORE_PASSWORD:?Secret KEYSTORE_PASSWORD absent}"
          : "${KEY_PASSWORD:?Secret KEY_PASSWORD absent}"
          : "${ANDROID_HOME:?Variable ANDROID_HOME absente}"

          KEYSTORE="$RUNNER_TEMP/release.keystore"
          ALIGNED="$RUNNER_TEMP/release-aligned.apk"
          trap 'rm -f "$KEYSTORE" "$ALIGNED"' EXIT

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"

          BUILD_TOOLS="$(
            find "$ANDROID_HOME/build-tools" \
              -mindepth 1 -maxdepth 1 -type d |
              sort -V |
              tail -n 1
          )"

          if [[ ! -x "$BUILD_TOOLS/zipalign" || ! -x "$BUILD_TOOLS/apksigner" ]]; then
            echo "Erreur : zipalign ou apksigner absent des Android Build Tools."
            exit 1
          fi

          shopt -s nullglob
          APKS=(app/build/outputs/apk/release/*-unsigned.apk)

          if (( ${#APKS[@]} != 1 )); then
            echo "Erreur : attendu exactement un APK non signé, trouvé ${#APKS[@]}."
            exit 1
          fi

          mkdir -p dist
          OUTPUT="dist/TuxWheel.apk"

          "$BUILD_TOOLS/zipalign" -f -v 4 "${APKS[0]}" "$ALIGNED"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --v4-signing-enabled false \
            --out "$OUTPUT" \
            "$ALIGNED"

          "$BUILD_TOOLS/apksigner" verify --verbose "$OUTPUT"

      - name: Upload APK to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          fail_on_unmatched_files: true
          files: dist/TuxWheel.apk
