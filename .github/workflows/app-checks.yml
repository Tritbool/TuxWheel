name: App checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: app-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Validate against current library source, not a released artifact.
      - name: Checkout BLE library
        uses: actions/checkout@v4
        with:
          repository: Tritbool/euc_ble_library
          ref: main
          path: .ci/euc-ble-library
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
          cache: gradle

      - name: Run unit tests, lint, and release assembly
        run: >-
          ./gradlew -PeucBleLibraryDir=.ci/euc-ble-library
          -Peuc.androidGradlePluginVersion=9.2.1
          :app:testDebugUnitTest
          --tests io.github.tuxwheel.GithubUpdatesTest
          --tests io.github.tuxwheel.GithubUpdatePromptTest
          --tests io.github.tuxwheel.ble.BleCommandDiscoveryTest
          --tests io.github.tuxwheel.ble.WheelAutoConnectTest
          --tests io.github.tuxwheel.RememberedWheelsTest
          --tests io.github.tuxwheel.settings.CommandContractMappingTest
          --tests io.github.tuxwheel.ble.BmsLabCaptureTest
          --tests io.github.tuxwheel.ble.RawTrafficCaptureTest
          --tests io.github.tuxwheel.bms.BmsSessionTest
          --tests io.github.tuxwheel.bms.BmsPresentationTest
          --tests io.github.tuxwheel.bms.SmartBmsScreenTest
          --tests io.github.tuxwheel.ble.WheelPasswordTest
          --tests io.github.tuxwheel.ble.WheelDiagnosticLogTest
          --tests io.github.tuxwheel.settings.WheelLockControlsTest
          --tests io.github.tuxwheel.settings.InMotionControlsTest
          --tests io.github.tuxwheel.feature.speedlimiter.SpeedLimiterTest
          --tests io.github.tuxwheel.feature.dashboard.DashboardRendererTest
          :app:lintDebug :app:assembleRelease --no-daemon

      - name: Retain Android regression reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-regression-reports
          path: |
            app/build/test-results/testDebugUnitTest
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/lint-results-debug.*
