name: App checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: app-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 0.1.2 is not yet on Maven Central; pin the P6 BMS API from merged PR #79.
      - name: Checkout BLE library
        uses: actions/checkout@v4
        with:
          repository: Tritbool/euc_ble_library
          ref: c371d75a62c9f3b3450c331199308e72300a2ff5
          path: .ci/euc-ble-library
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Publish BLE library to Maven Local
        working-directory: .ci/euc-ble-library
        run: bash ./gradlew :euc-ble-core:publishToMavenLocal --no-daemon

      - name: Run unit tests and lint
        run: ./gradlew :app:lintDebug --no-daemon
