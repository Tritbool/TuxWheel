name: App checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: app-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Validate against current library source, not a released artifact.
      - name: Checkout BLE library
        uses: actions/checkout@v4
        with:
          repository: Tritbool/euc_ble_library
          ref: 92fef1f285899c2e42f2a81f7ae53a9e73e9fd4f
          path: .ci/euc-ble-library
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
          cache: gradle

      - name: Run unit tests and lint
        run: >-
          ./gradlew -PeucBleLibraryDir=.ci/euc-ble-library
          :app:testDebugUnitTest
          --tests io.github.tuxwheel.ble.BmsLabCaptureTest
          --tests io.github.tuxwheel.bms.BmsSessionTest
          --tests io.github.tuxwheel.bms.SmartBmsScreenTest
          --tests io.github.tuxwheel.ble.WheelPasswordTest
          --tests io.github.tuxwheel.ble.WheelDiagnosticLogTest
          --tests io.github.tuxwheel.settings.WheelLockControlsTest
          --tests io.github.tuxwheel.settings.InMotionControlsTest
          :app:lintDebug --no-daemon
