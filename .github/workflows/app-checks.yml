name: App checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: app-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 0.1.3 is not yet on Maven Central; pin the revision used by the app.
      - name: Checkout BLE library
        uses: actions/checkout@v4
        with:
          repository: Tritbool/euc_ble_library
          ref: 0812eff691836b1943359d56efc3829bc3566bb9
          path: .ci/euc-ble-library
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Publish BLE library to Maven Local
        working-directory: .ci/euc-ble-library
        run: bash ./gradlew :euc-ble-core:publishToMavenLocal --no-daemon

      - name: Run unit tests and lint
        run: ./gradlew :app:testDebugUnitTest --tests io.github.tuxwheel.ble.BmsLabCaptureTest --tests io.github.tuxwheel.bms.BmsSessionTest :app:lintDebug --no-daemon
