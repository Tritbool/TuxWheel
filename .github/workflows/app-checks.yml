name: App checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: app-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Validate against current library source, not a released artifact.
      - name: Checkout BLE library
        uses: actions/checkout@v4
        with:
          repository: Tritbool/euc_ble_library
          ref: 6ffdef8e4949c1508112dd1cc1c3cfd9cd4b3dab
          path: .ci/euc-ble-library
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
          cache: gradle

      - name: Regenerate BLE Android dependency locks
        run: >-
          ./gradlew -p .ci/euc-ble-library -Peuc.androidGradlePluginVersion=9.2.1
          :euc-ble-android:dependencies --write-locks --no-daemon
          > "$RUNNER_TEMP/ble-dependencies.txt"

      - name: Run unit tests and lint
        run: >-
          ./gradlew -PeucBleLibraryDir=.ci/euc-ble-library
          -Peuc.androidGradlePluginVersion=9.2.1
          --write-locks
          :app:testDebugUnitTest
          --tests io.github.tuxwheel.ble.BmsLabCaptureTest
          --tests io.github.tuxwheel.bms.BmsSessionTest
          --tests io.github.tuxwheel.bms.SmartBmsScreenTest
          --tests io.github.tuxwheel.ble.WheelPasswordTest
          --tests io.github.tuxwheel.ble.WheelDiagnosticLogTest
          --tests io.github.tuxwheel.settings.WheelLockControlsTest
          --tests io.github.tuxwheel.settings.InMotionControlsTest
          :app:lintDebug --no-daemon

      - name: Retain regenerated BLE dependency locks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ble-dependency-locks
          path: .ci/euc-ble-library/**/gradle.lockfile
          include-hidden-files: true

      - name: Retain Android regression reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-regression-reports
          path: |
            app/build/test-results/testDebugUnitTest
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/lint-results-debug.*
