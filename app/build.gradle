import com.github.jk1.license.filter.LicenseBundleNormalizer
import com.github.jk1.license.render.InventoryMarkdownReportRenderer

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.ksp)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.license.report)
}

def enableGithubUpdates = providers.gradleProperty('enableGithubUpdates').orElse('true').get()
if (!(enableGithubUpdates in ['true', 'false'])) {
    throw new GradleException('enableGithubUpdates must be true or false')
}

android {
    compileSdk 37

    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
        }
    }

    defaultConfig {
        applicationId "io.github.tuxwheel"
        minSdk 23
        targetSdk 36
        versionCode 2
        versionName "0.0.2"
        buildConfigField "boolean", "ENABLE_GITHUB_UPDATES", enableGithubUpdates
        vectorDrawables.useSupportLibrary = true
        multiDexEnabled true
        ksp {
            arg("room.schemaLocation", "$projectDir/schemas")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.3"
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
        unitTests.all {
            jvmArgs '-Xmx2g'
        }
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/*.kotlin_module']
            merges += ['META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/ASL2.0']
        }
    }
    lint {
        abortOnError false
        disable 'ComposableNaming'
        baseline = file("lint-baseline.xml")
    }
    namespace 'io.github.tuxwheel'
}

dependencies {

    // Compose
    implementation libs.compose.foundation
    implementation libs.compose.runtime
    implementation libs.compose.ui
    implementation libs.compose.ui.tooling.preview
    debugImplementation libs.compose.ui.tooling
    implementation libs.compose.material3
    implementation libs.compose.navigation
    implementation libs.compose.material.icons
    implementation libs.richtext.material3
    implementation libs.richtext.commonmark

    // Lifecycle / ViewModel
    implementation libs.lifecycle.viewmodel.ktx
    implementation libs.lifecycle.viewmodel.compose
    implementation libs.lifecycle.runtime.ktx

    // Room
    implementation libs.room.runtime
    ksp libs.room.compiler
    implementation libs.room.ktx

    // EUC BLE
    implementation libs.euc.ble.library

    // AndroidX
    implementation libs.core.ktx
    implementation libs.appcompat
    implementation libs.material
    implementation libs.preference.ktx
    implementation libs.constraintlayout
    implementation libs.legacy.support.v4

    // Kotlin
    implementation libs.kotlin.stdlib
    implementation libs.coroutines.core
    implementation libs.coroutines.android

    // Koin
    implementation platform(libs.koin.bom)
    implementation libs.koin.android
    implementation libs.koin.compose

    // UI
    implementation libs.timber
    implementation libs.mpandroidchart

    // Test
    testImplementation libs.junit
    testImplementation libs.truth
    testImplementation libs.junit.jupiter
    testImplementation libs.mockk
    testImplementation libs.robolectric
    testImplementation libs.test.core
    testImplementation libs.kotlin.reflect
    testImplementation libs.mockwebserver
    testImplementation libs.json
    testImplementation libs.koin.test
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0"
}

licenseReport {
    outputDir = layout.buildDirectory.dir('reports/dependency-licenses').get().asFile.path
    configurations = ['releaseRuntimeClasspath', 'debugRuntimeClasspath']
    renderers = [new InventoryMarkdownReportRenderer(
        'third_party_licenses.md', 'TuxWheel', null, false
    )]
    filters = [new LicenseBundleNormalizer()]
}

abstract class SyncLicenseAssets extends Sync {
    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()
}

def copyLicenseReportToAssets = tasks.register('copyLicenseReportToAssets', SyncLicenseAssets) {
    dependsOn tasks.named('generateLicenseReport')
    outputDirectory.set(layout.buildDirectory.dir('generated/licenseAssets'))
    from(layout.buildDirectory.dir('reports/dependency-licenses')) {
        into 'licenses'
    }
    into outputDirectory
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.assets.addGeneratedSourceDirectory(copyLicenseReportToAssets) {
            it.outputDirectory
        }
    }
}
