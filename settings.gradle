pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    def eucBleVersion = providers.gradleProperty('eucBleVersion')
    if (eucBleVersion.isPresent()) {
        versionCatalogs {
            libs {
                version('euc-ble', eucBleVersion.get())
            }
        }
    }
    repositories {
        google()
        mavenLocal()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}

rootProject.name = "TuxWheel"

include ':app'

// Pin the not-yet-published background API, while allowing an explicit source override.
def eucBleLibraryDir = providers.gradleProperty('eucBleLibraryDir').orElse('ble-library')
if (eucBleLibraryDir.isPresent()) {
    if (!file("${eucBleLibraryDir.get()}/settings.gradle").exists()) {
        throw new GradleException('Initialize the pinned BLE source with git submodule update --init, or supply -PeucBleLibraryDir.')
    }
    includeBuild(eucBleLibraryDir.get()) {
        dependencySubstitution {
            substitute module('io.github.tritbool:euc-ble-library') using project(':euc-ble-android')
            substitute module('io.github.tritbool:euc-ble-core') using project(':euc-ble-core')
            substitute module('io.github.tritbool:euc-ble-session') using project(':euc-ble-session')
            substitute module('io.github.tritbool:euc-ble-protocols') using project(':euc-ble-protocols')
        }
    }
}
